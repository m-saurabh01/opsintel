[project]
name = "ehelp"
version = "0.1.0"
description = "eHelp - Air Force Document Intelligence portal"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "charset-normalizer>=3.3",
    "xlrd>=2.0",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "defusedxml>=0.7.1",
    "httpx>=0.27",
]

[project.scripts]
ehelp = "ehelp.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "xlwt>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ehelp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type Swig:DeprecationWarning", "ignore:builtin type swigvarlink:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
